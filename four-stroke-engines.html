const ELEVATION = 30;

  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run(); else { if (frame) cancelAnimationFrame(frame); frame = 0; last = 0; }
}, { rootMargin: "120px 0px" }).observe(stage);


const PART_INFO = {
  cylinder: ["气缸", "形成燃烧室，并引导活塞做往复运动。"],
  piston: ["活塞", "承受燃气的压力，把燃气的内能转化为往复运动的机械能。"],
  rod: ["连杆", "把活塞的往复运动传给曲轴。"],
  crank: ["曲轴", "把活塞的往复运动转化为旋转运动，输出动力。"],
  spark: ["火花塞", "在压缩冲程末产生电火花，点燃汽油与空气的混合气。"],
  injector: ["喷油嘴", "在压缩冲程末喷出雾状柴油，柴油遇高温高压空气自燃。"],
  intake: ["进气阀", "吸气冲程打开，让新鲜气体进入气缸。"],
  exhaust: ["排气阀", "排气冲程打开，让废气排出气缸。"],
  flywheel: ["飞轮", "储存做功冲程的能量，使曲轴运转平稳。"],
  carb: ["化油器", "把汽油雾化并与空气混合，形成可燃混合气。"],
  pump: ["喷油泵", "把柴油加压，经高压油管送到喷油嘴。"],
};
const PART_LISTS = {
  gas: ["cylinder", "piston", "rod", "crank", "spark", "intake", "exhaust", "flywheel", "carb"],
  diesel: ["cylinder", "piston", "rod", "crank", "injector", "intake", "exhaust", "flywheel", "pump"],
};
const hsLayer = document.querySelector("[data-hotspots]");
const partCard = document.querySelector("[data-part-card]");
const partHotspots = [];
let selectedPart = null;
if (hsLayer) {
  for (const e of engines) {
    for (const id of PART_LISTS[e.id] || []) {
      const info = PART_INFO[id];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "iso-hs";
      b.dataset.part = id;
      b.setAttribute("aria-label", e.label + " " + info[0] + "：" + info[1]);
      b.innerHTML = '<span class="iso-hs-label">' + info[0] + '</span>';
      b.addEventListener("pointerdown", (ev) => ev.stopPropagation());
      b.addEventListener("click", (ev) => { ev.stopPropagation(); selectPart(e, id); });
      hsLayer.appendChild(b);
      partHotspots.push({ el: b, engine: e, part: id });
    }
  }
}
function selectPart(engine, part) {
  selectedPart = part && engine ? engine.id + ":" + part : null;
  for (const h of partHotspots) {
    h.el.classList.toggle("selected", selectedPart === h.engine.id + ":" + h.part);
  }
  if (!partCard) return;
  if (!engine || !part) { partCard.classList.remove("open"); return; }
  const info = PART_INFO[part];
  partCard.querySelector("[data-pc-mode]").textContent = engine.id === "gas" ? "点燃式" : "压燃式";
  partCard.querySelector("[data-pc-name]").textContent = engine.label + " · " + info[0];
  partCard.querySelector("[data-pc-role]").textContent = info[1];
  partCard.classList.add("open");
}
if (partCard) {
  partCard.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  partCard.querySelector("[data-pc-close]").addEventListener("click", () => selectPart(null, null));
}
function partPoint(e, part, t) {
  const CA = D.cAxis, PD = D.pDir;
  const S = (s, p, z) => [e.cx + CA[0] * s + PD[0] * p, e.cy + CA[1] * s + PD[1] * p, z];
  const rad = t * DEG;
  const pinZ = pistonPinZ(e, t);
  if (part === "piston") return [e.cx, e.cy, pinZ + e.pistonH / 2];
  if (part === "crank") return [e.cx, e.cy, e.crankZ];
  if (part === "rod") {
    const B = [e.cx + PD[0] * e.r * Math.sin(rad), e.cy + PD[1] * e.r * Math.sin(rad), e.crankZ + e.r * Math.cos(rad)];
    return [(B[0] + e.cx) / 2, (B[1] + e.cy) / 2, (B[2] + pinZ) / 2];
  }
  if (part === "cylinder") return S(-e.blockOuter * 0.9, 0, (e.blockBottom + e.headTop) / 2);
  if (part === "spark" || part === "injector") return [e.cx + PD[0] * e.plugP, e.cy + PD[1] * e.plugP, e.headTop + 3.5];
  if (part === "intake") return S(e.valveS, 2, e.headTop + 4);
  if (part === "exhaust") return S(-e.valveS, 2, e.headTop + 4);
  if (part === "flywheel") return [e.cx + CA[0] * ((e.flyFrom + e.flyTo) / 2), e.cy + CA[1] * ((e.flyFrom + e.flyTo) / 2), e.crankZ];
  if (part === "carb") return S(24.5 + e.runnerLen + 2, 0, e.portZ);
  if (part === "pump") return S(-18, -36, 38);
  return [e.cx, e.cy, 20];
}
function updateHotspots(t) {
  if (!hsLayer) return;
  for (const h of partHotspots) {
    const p = partPoint(h.engine, h.part, t);
    const q = iso(p, P);
    if (!q || q[0] < 4 || q[0] > D.W - 4 || q[1] < 4 || q[1] > D.H - 4) {
      h.el.style.opacity = "0";
      h.el.style.pointerEvents = "none";
      continue;
    }
    h.el.style.opacity = "1";
    h.el.style.pointerEvents = "auto";
    h.el.style.left = (q[0] / D.W * 100).toFixed(2) + "%";
    h.el.style.top = (q[1] / D.H * 100).toFixed(2) + "%";
    h.el.classList.toggle("flip", q[0] > D.W - 120);
  }
}

const EDU = {
  names: ["吸气冲程", "压缩冲程", "做功冲程", "排气冲程"],
  energy: [
    "进气门打开，活塞下行，吸入新鲜气体",
    "机械能 → 内能（气体被压缩、温度升高）",
    "内能 → 机械能（燃气膨胀推动活塞下行）",
    "排气门打开，活塞上行，排出废气",
  ],
  colors: ["#5f9fb5", "#2f6f88", "#b23a26", "#8f2a1c"],
  medium: {
    gas: ["汽油 + 空气混合气", "被压缩的混合气（末端火花塞点火）", "燃烧的高温燃气（红色）", "废气"],
    diesel: ["空气", "高温高压空气（末端喷入雾状柴油）", "雾状柴油自燃后的高温燃气（红色）", "废气"],
  },
};
const KIND = engines[0] ? engines[0].id : "gas";
const edu = {
  play: document.querySelector("[data-edu-play]"),
  playIcon: document.querySelector("[data-edu-play-icon]"),
  playLabel: document.querySelector("[data-edu-play-label]"),
  step: document.querySelector("[data-edu-step]"),
  reset: document.querySelector("[data-edu-reset]"),
  scrub: document.querySelector("[data-edu-scrub]"),
  angle: document.querySelector("[data-edu-angle]"),
  angle2: document.querySelector("[data-edu-angle2]"),
  phase: document.querySelector("[data-edu-phase]"),
  name: document.querySelector("[data-edu-name]"),
  energyEl: document.querySelector("[data-edu-energy]"),
  medium: document.querySelector("[data-edu-medium]"),
  steps: [...document.querySelectorAll("[data-edu-step-btn]")],
  quizBtn: document.querySelector("[data-edu-quiz]"),
  modal: document.querySelector("[data-edu-quiz-modal]"),
  quizBody: document.querySelector("[data-edu-quiz-body]"),
  quizProgress: document.querySelector("[data-edu-quiz-progress]"),
  last: -1,
};
function updateEduPlay() {
  if (!edu.play) return;
  edu.play.setAttribute("aria-pressed", String(!paused));
  if (edu.playIcon) edu.playIcon.textContent = paused ? "▶" : "⏸";
  if (edu.playLabel) edu.playLabel.textContent = paused ? "播放" : "暂停";
}
function syncEdu(t) {
  if (!edu.name) return;
  const idx = Math.floor(t / 180) % 4;
  const label = EDU.names[idx];
  const angle = String(Math.round(t)).padStart(3, "0") + "°";
  if (edu.angle) edu.angle.textContent = angle + " · " + label.replace("冲程", "");
  if (edu.angle2) edu.angle2.textContent = angle;
  if (idx !== edu.last) {
    edu.last = idx;
    edu.name.textContent = label;
    edu.energyEl.textContent = EDU.energy[idx];
    edu.medium.innerHTML = "介质：<b>" + EDU.medium[KIND][idx] + "</b>";
    edu.phase.style.setProperty("--c", EDU.colors[idx]);
    edu.steps.forEach((b, i) => b.classList.toggle("active", i === idx));
  }
  if (edu.scrub && document.activeElement !== edu.scrub) edu.scrub.value = String(Math.round(t));
}
if (edu.play) edu.play.addEventListener("click", () => { paused = !paused; updateEduPlay(); run(); });
if (edu.step) edu.step.addEventListener("click", () => { paused = true; theta = (theta + 15) % 720; manualUntil = clock + 4; syncEdu(theta); updateEduPlay(); run(); });
if (edu.reset) edu.reset.addEventListener("click", () => { paused = false; theta = 0; manualUntil = clock + 4; syncEdu(theta); updateEduPlay(); run(); });
if (edu.scrub) edu.scrub.addEventListener("input", () => { paused = true; theta = Number(edu.scrub.value); manualUntil = clock + 4; syncEdu(theta); updateEduPlay(); run(); });
const STROKE_CENTERS = [90, 270, 450, 630];
edu.steps.forEach((b, i) => b.addEventListener("click", () => { paused = true; theta = STROKE_CENTERS[i]; manualUntil = clock + 4; syncEdu(theta); updateEduPlay(); run(); }));
updateEduPlay();

const gearLayer = document.querySelector("[data-dial-gears]");
const gearButtons = [];
if (gearLayer) {
  const defs = [
    { name: "吸气", theta: 90 },
    { name: "压缩", theta: 270 },
    { name: "做功", theta: 450 },
    { name: "排气", theta: 630 },
  ];
  const c = iso([D.dial[0], D.dial[1], 3.45], P);
  defs.forEach((g, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "iso-gear";
    b.textContent = g.name;
    b.dataset.gear = String(i);
    const a = (g.theta * 0.5 - 90) * DEG;
    const r = 10 + 9 * (g.theta / 720);
    const p = iso([D.dial[0] + r * Math.cos(a), D.dial[1] + r * Math.sin(a), 3.45], P);
    const vx = p[0] - c[0], vy = p[1] - c[1];
    const len = Math.hypot(vx, vy) || 1;
    b.style.left = (c[0] / D.W * 100).toFixed(2) + "%";
    b.style.top = (c[1] / D.H * 100).toFixed(2) + "%";
    b.style.translate = "calc(var(--gear-r) * " + (vx / len).toFixed(3) + ") calc(var(--gear-r) * " + (vy / len).toFixed(3) + ")";
    b.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      theta = g.theta;
      manualUntil = clock + 4;
      if (edu.play) {
        paused = true;
        syncEdu(theta);
        updateEduPlay();
      }
      run();
    });
    gearLayer.appendChild(b);
    gearButtons.push({ el: b, theta: g.theta });
  });
}
function syncGears(t) {
  if (!gearButtons.length) return;
  const idx = Math.floor(t / 180) % 4;
  gearButtons.forEach((g, i) => {
    g.el.style.setProperty("--c", PHASE_COLORS[i % 4]);
    g.el.classList.toggle("active", i === idx);
  });
}

const QUIZ_POOL = [
  { q: "柴油机气缸顶部是火花塞。", a: false, why: "柴油机顶部是喷油嘴，没有火花塞；它靠压燃着火。" },
  { q: "汽油机吸入的是汽油和空气的混合气体。", a: true, why: "汽油机在吸气冲程吸入汽油与空气的混合物。" },
  { q: "柴油机在压缩冲程末，喷油嘴喷出雾状柴油，柴油遇高温空气自燃。", a: true, why: "柴油机压缩比大，压缩末空气温度很高，柴油喷入后自行着火，属于压燃式。" },
  { q: "四冲程内燃机完成一个工作循环，曲轴转两圈，活塞往复运动两次。", a: true, why: "四个冲程对应活塞上下各两次，即往复运动两次；曲轴转两圈，只有做功冲程对外做功。" },
  { q: "压缩冲程中，气体的内能转化为活塞的机械能。", a: false, why: "压缩冲程是活塞的机械能转化为气体的内能，气体温度升高。" },
  { q: "做功冲程中，燃气推动活塞下行，内能转化为机械能。", a: true, why: "高温高压燃气膨胀做功，内能转化为活塞的机械能。" },
  { q: "汽油机的压缩比通常比柴油机大。", a: false, why: "柴油机的压缩比更大，所以压缩末空气温度更高，能够使柴油自燃。" },
  { q: "排气冲程中，排气门打开，进气门关闭。", a: true, why: "排气冲程排气门开、进气门闭，活塞上行把废气排出。" },
  { q: "汽油机和柴油机都靠火花塞点燃燃料。", a: false, why: "汽油机用火花塞点燃；柴油机由喷油嘴喷油后压燃，没有火花塞。" },
  { q: "柴油机效率较高，常用于卡车、拖拉机等重型机械。", a: true, why: "柴油机压缩比大、效率较高、功率大，适合重型机械。" },
  { q: "吸气冲程中，进气门关闭，活塞下行。", a: false, why: "吸气冲程进气门打开，活塞下行，把新鲜气体吸入气缸。" },
  { q: "内燃机的一个工作循环中，只有做功冲程对外做功。", a: true, why: "只有做功冲程燃气推动活塞对外做功，其余冲程靠飞轮的惯性完成。" },
];
let quizQuestions = [], quizState = [], quizWasPlaying = false;
function shuffleQuiz(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function openQuiz() {
  if (!edu.modal) return;
  quizWasPlaying = edu.play ? edu.play.getAttribute("aria-pressed") === "true" : false;
  if (quizWasPlaying && edu.play) edu.play.click();
  quizQuestions = shuffleQuiz(QUIZ_POOL).slice(0, 3);
  quizState = [null, null, null];
  renderQuiz();
  edu.modal.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeQuiz() {
  if (!edu.modal) return;
  edu.modal.classList.remove("open");
  document.body.style.overflow = "";
  if (quizWasPlaying && edu.play) edu.play.click();
}
function renderQuiz() {
  if (!edu.quizBody) return;
  const answered = quizState.filter((v) => v !== null).length;
  if (edu.quizProgress) edu.quizProgress.textContent = String(Math.min(answered + 1, 3)) + " / 3";
  edu.quizBody.innerHTML = "";
  quizQuestions.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "edu-q";
    card.innerHTML = '<div class="edu-q-num">第 ' + (i + 1) + ' 题</div>' +
      '<div class="edu-q-text">' + item.q + '</div>' +
      '<div class="edu-q-actions"><button class="edu-q-btn" type="button" data-answer="true">对</button><button class="edu-q-btn" type="button" data-answer="false">错</button></div>' +
      '<div class="edu-q-feedback"></div>';
    const buttons = [...card.querySelectorAll(".edu-q-btn")];
    const feedback = card.querySelector(".edu-q-feedback");
    if (quizState[i] !== null) {
      const ok = quizState[i] === item.a;
      buttons.forEach((b) => {
        b.disabled = true;
        if (String(item.a) === b.dataset.answer) b.classList.add("correct");
        else if (String(quizState[i]) === b.dataset.answer && !ok) b.classList.add("wrong");
      });
      feedback.classList.add("show");
      feedback.innerHTML = "<b>" + (ok ? "答对了！" : "再想一想。") + "</b> 正确答案：<b>" + (item.a ? "对" : "错") + "</b>。" + item.why;
    } else {
      buttons.forEach((b) => b.addEventListener("click", () => { quizState[i] = b.dataset.answer === "true"; renderQuiz(); }));
    }
    edu.quizBody.appendChild(card);
  });
  if (quizState.every((v) => v !== null)) {
    const score = quizQuestions.reduce((n, item, i) => n + (quizState[i] === item.a ? 1 : 0), 0);
    const row = document.createElement("div");
    row.className = "edu-quiz-score";
    row.innerHTML = '<div class="score">' + score + ' / 3 <span>' + (score === 3 ? "全部正确，考点掌握得很好！" : score >= 2 ? "不错，再复习一下错题。" : "回到对比面板，再看一遍五个差异。") + '</span></div><div class="actions"><button class="edu-btn" type="button" data-retry>再来一组</button><button class="edu-btn primary" type="button" data-quiz-done>完成</button></div>';
    row.querySelector("[data-retry]").addEventListener("click", () => { quizQuestions = shuffleQuiz(QUIZ_POOL).slice(0, 3); quizState = [null, null, null]; renderQuiz(); });
    row.querySelector("[data-quiz-done]").addEventListener("click", closeQuiz);
    edu.quizBody.appendChild(row);
  }
}
if (edu.quizBtn) edu.quizBtn.addEventListener("click", openQuiz);
if (edu.modal) {
  edu.modal.querySelectorAll("[data-edu-quiz-close]").forEach((el) => el.addEventListener("click", closeQuiz));
}
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && edu.modal && edu.modal.classList.contains("open")) closeQuiz();
});

if (still.matches) { touring = false; theta = 90; }
setShow(null);
draw(theta);
for (const b of document.querySelectorAll("[data-speed]")) {
  b.addEventListener("click", () => {
    const i = SPEEDS.indexOf(speed);
    speed = SPEEDS[(i + 1) % SPEEDS.length];
    try { localStorage.setItem("engineSpeed", String(speed)); } catch (e) {}
    updateSpeedUi();
    run();
  });
}
updateSpeedUi();
run();
if (!still.matches && AUTO_TOUR) setTimeout(() => { touring = true; tourClock = 0; tourShown = undefined; run(); }, 1400);
</script></body></html>
